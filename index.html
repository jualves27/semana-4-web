<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Desafios JS - Arrays, DOM e Eventos</title>
  <style>
    .destaque { background-color: yellow; font-weight: bold; }
    .feito { text-decoration: line-through; color: gray; }
    ul { cursor: pointer; }
  </style>
</head>
<body>

  <h1>Desafios Práticos JS</h1>

  <!Elementos para o Bloco 3 (Eventos)>
  <button id="botao">Clique Aqui</button>
  <br><br>
  
  <input type="text" id="nome" placeholder="Digite seu nome...">
  <br><br>

  <form id="formulario">
    <input type="text" id="tarefa" placeholder="Nova tarefa...">
    <button type="submit">Adicionar Tarefa</button>
  </form>

  <h3>Sua Lista de Tarefas:</h3>
  <ul id="lista">
    <!Serão adicionados itens via HTML e JS>
  </ul>

  <script src="app.js"></script>
</body>
</html>
